﻿<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJ Solutions · Production Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
:root {
  --bg: #FFFFFF;
  --bg-2: #F8FAFC;
  --bg-3: #F1F5F9;
  --border: #E2E8F0;
  --border-hi: #CBD5E1;
  --primary: #0EA5E9;
  --primary-dark: #0284C7;
  --primary-bg: #F0F9FF;
  --primary-border: #BAE6FD;
  --primary-text: #0369A1;
  --text: #0F172A;
  --text-2: #475569;
  --text-3: #64748B;
  --text-4: #94A3B8;
  --ok: #16A34A;
  --ok-bg: #F0FDF4;
  --ok-border: #BBF7D0;
  --warn: #0D9488;
  --warn-bg: #F0FDFA;
  --warn-border: #5EEAD4;
  --bad: #0C4A6E;
  --bad-bg: #E0F2FE;
  --bad-border: #7DD3FC;
  --font-sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --r: 6px;
  --r-sm: 4px;
  --r-lg: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-2); font-family: var(--font-sans); color: var(--text); height: 100%; }

.dash {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 52px 1fr;
  min-height: 100vh;
  background: var(--bg);
  max-width: 1600px;
  margin: 0 auto;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.top-bar {
  grid-column: 1 / -1;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.brand-block { display: flex; align-items: center; gap: 10px; }
.logo-img { width: 28px; height: 28px; object-fit: contain; }
.brand-text { display: flex; flex-direction: column; }
.brand-name { font-size: 13px; font-weight: 700; letter-spacing: 0.03em; color: var(--text); line-height: 1.2; }
.brand-sub { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-3); text-transform: uppercase; line-height: 1.2; }
.divider { width: 1px; height: 20px; background: var(--border); }
.status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  background: var(--primary-bg); border: 1px solid var(--primary-border);
  border-radius: 100px; font-family: var(--font-mono); font-size: 11px;
  font-weight: 600; color: var(--primary-text); letter-spacing: 0.04em; text-transform: uppercase;
}
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); animation: blink 2s ease-in-out infinite; }
.status-badge.error { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
.status-badge.error .status-dot { background: var(--bad); animation: none; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
.nav-link {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
  font-size: 12px; font-weight: 500; color: var(--text-2); text-decoration: none;
  border: 1px solid var(--border); border-radius: var(--r-sm); transition: all 0.12s;
  letter-spacing: 0.01em;
}
.nav-link:hover { background: var(--bg-3); color: var(--text); border-color: var(--border-hi); }
.clock-block { text-align: right; }
.clock { font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
.date-str { font-size: 10px; font-weight: 500; color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }

.left-panel { background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.panel-title {
  padding: 12px 14px 8px;
  font-size: 10px; font-weight: 600; color: var(--text-3);
  letter-spacing: 0.1em; text-transform: uppercase;
  display: flex; align-items: center; gap: 5px; border-bottom: 1px solid var(--border);
}
.panel-title svg { width: 11px; height: 11px; }
.floor-tabs { display: flex; border-bottom: 1px solid var(--border); }
.floor-tab {
  flex: 1; padding: 8px 4px; font-size: 10px; font-weight: 600; text-align: center;
  cursor: pointer; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase;
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.12s;
}
.floor-tab:hover { color: var(--text-2); }
.floor-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.line-list { padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; flex: 1; }
.line-list::-webkit-scrollbar { width: 3px; }
.line-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
.line-card {
  padding: 7px 10px; border-radius: var(--r-sm); cursor: pointer;
  transition: background 0.1s; border: 1px solid transparent; position: relative;
}
.line-card:hover { background: var(--bg-3); }
.line-card.active { background: var(--primary-bg); border-color: var(--primary-border); }
.line-card.active::before {
  content: ''; position: absolute; left: -1px; top: 6px; bottom: 6px;
  width: 2px; background: var(--primary); border-radius: 1px;
}
.lc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.lc-id { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text); }
.lc-name-txt { font-size: 11px; color: var(--text-3); margin-left: 4px; font-weight: 400; }
.badge { font-family: var(--font-mono); font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 3px; font-variant-numeric: tabular-nums; border: 1px solid; }
.badge-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.badge-warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.badge-bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-border); }
.badge-aux { background: var(--bg-3); color: var(--text-3); border-color: var(--border); }
.lc-bar { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
.lc-bar-fill { height: 100%; border-radius: 1px; transition: width 0.4s ease; }

.main-panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; overflow-y: auto; }
.line-hd { display: flex; align-items: flex-start; justify-content: space-between; }
.line-hd-left {}
.line-hd-name { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; }
.line-hd-id { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--primary); }
.line-hd-meta { font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 5px; }
.line-hd-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 12px 14px; border-left: 3px solid var(--border);
}
.kpi.ok { border-left-color: var(--ok); }
.kpi.warn { border-left-color: var(--warn); }
.kpi.danger { border-left-color: var(--bad); }
.kpi.aux { border-left-color: var(--border-hi); }
.kpi-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.kpi-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em; }
.kpi-ico { color: var(--text-3); display: flex; align-items: center; }
.kpi-ico svg { width: 14px; height: 14px; }
.kpi-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--text); line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 5px; }
.kpi-sub .target-num { font-family: var(--font-mono); color: var(--text-2); font-weight: 500; }

.section-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 16px; }
.section-title {
  font-size: 10px; font-weight: 600; color: var(--text-3); letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 14px; display: flex;
  justify-content: space-between; align-items: center;
}
.section-title-left { display: flex; align-items: center; gap: 6px; }
.section-title svg { width: 12px; height: 12px; }
.chart-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-3); font-weight: 400; text-transform: none; letter-spacing: 0; }
.chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }
.legend-line { width: 14px; height: 0; border-top: 1.5px dashed var(--text-3); }

.alert-row { display: flex; gap: 6px; flex-wrap: wrap; }
.alert-pill {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px;
  border-radius: var(--r-sm); font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid;
}
.alert-pill .ai { display: flex; align-items: center; }
.alert-pill .ai svg { width: 12px; height: 12px; }
.alert-pill.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.alert-pill.err { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-border); }
.alert-pill.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.alert-pill.info { background: var(--primary-bg); color: var(--primary-text); border-color: var(--primary-border); }

/* ===== TABLET SCALE-UP (MAX) ===== */
html { -webkit-text-size-adjust: 100%; }
* { -webkit-tap-highlight-color: transparent; }
html, body { font-size: 16px; }
a, button, [onclick], .floor-tab, .line-card, .main-tab { cursor: pointer; }
.top-bar, .left-panel, .floor-tab, .floor-tabs, .panel-title,
.main-tab, .main-tab-bar, .lc-row, .lc-id, .lc-name-txt,
.btn-primary, .btn-outline, .btn-secondary, .kpi-label, .kpi-sub {
  user-select: none; -webkit-user-select: none;
}
.dash { grid-template-columns: 300px 1fr; grid-template-rows: 72px 1fr; }
.top-bar { height: 72px; padding: 0 24px; }
.logo-img { width: 42px; height: 42px; }
.brand-name { font-size: 17px; }
.brand-sub { font-size: 12px; }
.clock { font-size: 28px; }
.date-str { font-size: 12px; }
.status-badge { font-size: 13px; padding: 7px 14px; }
.nav-link { font-size: 14px; padding: 10px 16px; min-height: 48px; touch-action: manipulation; }
.panel-title { padding: 16px 20px 12px; font-size: 11px; }
.floor-tab { padding: 0 4px; font-size: 12px; min-height: 52px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.floor-tab:active { background: var(--bg-3); }
.line-card { padding: 14px 20px; min-height: 64px; touch-action: manipulation; }
.line-card:active { background: var(--bg-3) !important; }
.lc-id { font-size: 14px; }
.lc-name-txt { font-size: 13px; }
.badge { font-size: 13px; }
.lc-bar { height: 3px; margin-top: 6px; }
.main-panel { padding: 24px; gap: 20px; }
.kpi { padding: 20px 24px; }
.kpi-value { font-size: 40px; }
.kpi-label { font-size: 11px; }
.kpi-sub { font-size: 13px; margin-top: 8px; }
.section-card { padding: 22px 24px; }
.section-title { font-size: 11px; }
.section-title-left { font-size: 12px; }
.alert-pill { font-size: 14px; padding: 10px 16px; min-height: 44px; }
.line-hd-name { font-size: 30px; }
.line-hd-id { font-size: 26px; }
.line-hd-meta { font-size: 14px; }
.line-hd-updated { font-size: 14px; }
.main-tab { padding: 0 24px; font-size: 14px; min-height: 52px; display: inline-flex; align-items: center; gap: 5px; touch-action: manipulation; }

.log-filter-bar { padding: 14px 20px; gap: 12px; }
.log-search-wrap { padding: 12px 16px; min-height: 52px; }
.log-search { font-size: 16px; }
.log-pill { padding: 9px 16px; font-size: 13px; min-height: 44px; touch-action: manipulation; }
.log-pill:active { background: var(--primary-bg); }
.log-table th { padding: 13px 16px; font-size: 12px; }
.log-table td { padding: 15px 16px; font-size: 14px; }
.log-time { font-size: 14px; }

#clickStatus .section-card { padding: 16px 20px; }
#hourChart { height: 240px; }

/* ===== MES / HMI OVERRIDES ===== */
:root {
  --r: 2px;
  --r-sm: 1px;
  --r-lg: 3px;
}
/* Topbar: plain status indicator */
.status-badge {
  background: none;
  border-color: var(--border-hi);
  letter-spacing: 0.04em;
  border-radius: 2px;
}
.nav-link { border-radius: 2px; }
.divider { height: 16px; }
/* Panel: no icon decoration */
.panel-title svg { display: none; }
.panel-title { letter-spacing: 0.06em; font-size: 9px; }
/* Line list: flat rows, not cards */
.line-list { padding: 0; gap: 0; }
.line-card {
  border-radius: 0;
  border-left: none;
  border-right: none;
  border-top: none;
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  background: none;
}
.line-card:first-child { border-top: 1px solid var(--border); }
.line-card:hover { background: var(--bg-3); border-color: var(--border); border-top: none; }
.line-card.active {
  background: var(--bg-3);
  border-color: var(--border);
}
.line-card.active::before {
  width: 2px; left: 0; top: 0; bottom: 0; border-radius: 0;
}
/* Badges: text-only, no background */
.badge { background: none; border: none; padding: 0 2px; }
.badge-ok { color: var(--ok); }
.badge-warn { color: var(--warn); }
.badge-bad { color: var(--bad); }
.badge-aux { color: var(--text-4); }
/* KPI: unified data row with dividers, not individual cards */
.kpi-row {
  border: 1px solid var(--border);
  gap: 0;
  border-radius: 3px;
  overflow: hidden;
}
.kpi {
  background: none;
  border-radius: 0;
  border: none;
  border-left: 2px solid transparent;
  border-right: 1px solid var(--border);
}
.kpi:last-child { border-right: none; }
.kpi.ok { border-left-color: var(--ok); }
.kpi.warn { border-left-color: var(--warn); }
.kpi.danger { border-left-color: var(--bad); }
.kpi.aux { border-left-color: var(--border-hi); }
/* KPI: hide icon, tighten spacing */
.kpi-ico { display: none; }
.kpi-hd { margin-bottom: 4px; }
.kpi-value { font-size: 26px; font-family: var(--font-mono); letter-spacing: -0.02em; }
.kpi-label { font-size: 9px; letter-spacing: 0.05em; color: var(--text-4); }
/* Section title: no icon */
.section-title-left svg { display: none; }
.section-title-left { gap: 0; }
.section-title { letter-spacing: 0.05em; font-size: 9px; color: var(--text-4); }
/* Alert pills: sharp, no icon */
.alert-pill { border-radius: 2px; }
.alert-pill .ai { display: none; }
/* Chart section: sharper */
.section-card { border-radius: 3px; }
/* Tabs */
.main-tab { border-radius: 0; }
.floor-tab { font-size: 10px; }
/* Log */
.log-line-badge { border-radius: 1px; }
.log-pill { border-radius: 2px; }
.log-search-wrap { border-radius: 2px; }
.log-filter-bar { background: var(--bg); }
.log-more-btn { border-radius: 0; }
/* Sidebar toggle */
.sidebar-toggle { border-radius: 2px; }

/* ===== TABLET / TOUCH ===== */
.sidebar-toggle {
  display: none; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--r);
  border: 1px solid var(--border); background: none;
  cursor: pointer; color: var(--text-2); flex-shrink: 0; transition: all 0.12s;
}
.sidebar-toggle:hover { background: var(--bg-3); }
.sidebar-toggle svg { width: 18px; height: 18px; }
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15,23,42,0.45); z-index: 99;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.sidebar-overlay.show { display: block; }

@media (max-width: 1100px) {
  .dash { grid-template-columns: 200px 1fr; }
}
@media (max-width: 860px) {
  .dash { grid-template-columns: 1fr; }
  .left-panel {
    position: fixed; left: 0; top: 0; bottom: 0; width: 280px;
    z-index: 100; transform: translateX(-110%);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 4px 0 24px rgba(0,0,0,0.12);
  }
  .left-panel.open { transform: translateX(0); }
  .sidebar-toggle { display: flex; }
  .main-panel { padding: 12px; gap: 10px; }
  .top-bar { padding: 0 12px; height: 52px; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .kpi-value { font-size: 24px; }
  .line-hd-name { font-size: 18px; }
  .line-hd-id { font-size: 15px; }
  /* Touch targets */
  .floor-tab { padding: 11px 4px; font-size: 11px; }
  .line-card { padding: 11px 12px; }
  .main-tab { padding: 11px 16px; }
  .main-tab-bar { margin-bottom: 10px; }
  .nav-link { padding: 8px 12px; font-size: 12px; }
  .log-filter-bar { padding: 10px 12px; }
  .log-more-btn { padding: 13px; }
  /* Log table: scroll on overflow */
  #logTableWrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}
@media (max-width: 600px) {
  .kpi-row { grid-template-columns: 1fr 1fr; gap: 8px; }
  .clock-block { display: none; }
  .brand-name { font-size: 12px; }
  .brand-sub { display: none; }
  .kpi { padding: 10px 12px; }
  .kpi-value { font-size: 22px; }
  .section-card { padding: 12px 12px; }
  .main-panel { padding: 10px; }
}

/* Main panel tabs */
.main-tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.main-tab {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 9px 16px; font-size: 12px; font-weight: 600;
  color: var(--text-3); cursor: pointer; background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 0.12s, border-color 0.12s; letter-spacing: 0.01em;
}
.main-tab:hover { color: var(--text-2); }
.main-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.main-tab svg { width: 13px; height: 13px; }

/* Log table */
.log-table { width: 100%; border-collapse: collapse; }
.log-table th {
  padding: 8px 12px; font-size: 10px; font-weight: 600;
  color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase;
  border-bottom: 1px solid var(--border); text-align: left; background: var(--bg-2);
  white-space: nowrap;
}
.log-table td {
  padding: 8px 12px; font-size: 12px; color: var(--text-2);
  border-bottom: 1px solid var(--border); vertical-align: middle;
}
.log-table tr:last-child td { border-bottom: none; }
.log-table tr:hover td { background: var(--bg-2); }
.log-count { font-family: var(--font-mono); font-weight: 600; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.log-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.log-empty { padding: 40px 16px; text-align: center; color: var(--text-3); font-size: 12px; }
.log-line-badge { font-family: var(--font-mono); font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; background: var(--primary-bg); color: var(--primary-text); border: 1px solid var(--primary-border); }
.log-filter-bar { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--bg-2); flex-wrap: wrap; }
.log-search-wrap { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 5px 10px; min-width: 200px; flex: 1; transition: border-color 0.12s; }
.log-search-wrap:focus-within { border-color: var(--primary); }
.log-search-wrap svg { width: 12px; height: 12px; color: var(--text-4); flex-shrink: 0; }
.log-search { border: none; outline: none; font-family: var(--font-sans); font-size: 12px; color: var(--text); background: transparent; width: 100%; }
.log-search::placeholder { color: var(--text-4); }
.log-pill-wrap { display: flex; gap: 4px; flex-wrap: wrap; }
.log-pill { padding: 3px 10px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 100px; cursor: pointer; color: var(--text-3); background: var(--bg); transition: all 0.1s; }
.log-pill:hover { border-color: var(--border-hi); color: var(--text-2); }

function adaptApiResponse(raw) {
  const f = API_CONFIG.fields;
  const arr = API_CONFIG.dataKey ? raw[API_CONFIG.dataKey] : raw;
  return arr.map(item => {
    const lineId = item[f.id] || '';
    const apiFloor = item[f.floor] || '';
    const floor = API_CONFIG.floorMap[apiFloor] ?? (apiFloor || API_CONFIG.floorFallback);
    const hourlyRaw = f.hourly ? (item[f.hourly] || []) : [];
    const hourlyParsed = hourlyRaw.map(h => ({
      hour: String(h[f.hourlyHour]).split(':')[0].padStart(2, '0'),
      count: Number(h[f.hourlyCount]) || 0,
    }));
    // API가 08~17시만 반환하더라도 다른 시간대에 생산이 발생할 수 있으므로
    // 00~23시 전체를 채워 차트에 표시한다. 비근무 시간대는 0(회색 막대)으로 표시.
    const workHourSet = new Set(hourlyParsed.map(h => h.hour));
    const hourlyMap = {};
    hourlyParsed.forEach(h => { hourlyMap[h.hour] = h.count; });
    const hourly = Array.from({length: 24}, (_, i) => {
      const h = String(i).padStart(2, '0');
      return { hour: h, count: hourlyMap[h] ?? 0 };
    });
    const actual = f.actual ? Number(item[f.actual]) || 0 : hourlyParsed.reduce((s, h) => s + (h.count || 0), 0);
    const defectRate = f.defectRate ? (API_CONFIG.defectRateUnit === 'percent' ? (Number(item[f.defectRate]) || 0) / 100 : Number(item[f.defectRate]) || 0) : 0;
    const bottlenecks = f.bottlenecks ? (item[f.bottlenecks] || []).map(b => ({ process: b[f.bottleneckProcess] || '', pct: Number(b[f.bottleneckPct]) || 0 })) : [];
    return {
      id: lineId, name: item[f.name] || lineId, floor, target: Number(item[f.target]) || 0,
      actual, workers: f.workers ? Number(item[f.workers]) || 0 : 0, hourly,
      workHours: [...workHourSet],
      defectRate, defectCount: f.defectCount ? Number(item[f.defectCount]) || 0 : 0,
      bottlenecks, isHelper: API_CONFIG.helperLineIds.includes(lineId),
    };
  });
}

function extractLogs(raw) {
  const lf = API_CONFIG.logFields;
  const entries = Array.isArray(raw) ? raw : [];
  return entries
    .filter(e => e[lf.eventType] === 'finish')
    .map(e => ({
      time: e[lf.time] || '',
      lineId: e[lf.lineId] || '',
      tableName: e[lf.tableName] || e[lf.processName] || '—',
      processName: e[lf.processName] || '—',
      workerName: e[lf.workerName] || e[lf.workerId] || '—',
      cycleSecs: e[lf.cycleSecs] != null ? Number(e[lf.cycleSecs]) : null,
    }))
    .sort((a, b) => new Date(b.time) - new Date(a.time));
}

async function loadLogs() {
  if (!API_CONFIG.logsEndpoint || !LINES.length) return;
  const lineIds = LINES.filter(l => !l.isHelper).map(l => l.id);
  try {
    const results = await Promise.all(lineIds.map(id =>
      fetch(
        API_CONFIG.baseUrl + API_CONFIG.logsEndpoint +
        '?line_id=' + encodeURIComponent(id) + '&limit=' + API_CONFIG.logsLimit,
        { headers: { 'ngrok-skip-browser-warning': 'true' } }
      ).then(r => r.ok ? r.json() : []).catch(() => [])
    ));
    LOGS = extractLogs(results.flat());
    if (activeMainTab === 'log') renderLogTab();
  } catch (e) {
    console.error('[API] loadLogs 실패:', e);
  }
}

    if (typeof lucide !== 'undefined') lucide.createIcons();
  } catch { el.innerHTML = ''; }
}

function getFilteredLogs() {
  const q = logFilter.search;
  return LOGS.filter(e => {
    if (logFilter.lineId !== 'all' && e.lineId !== logFilter.lineId) return false;
    if (q) {
      const hay = (e.tableName + ' ' + e.workerName + ' ' + e.lineId).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function onLogSearch(val) {
  logFilter.search = val.trim().toLowerCase();
  logPage = 1;
  renderLogTable();
}

function setLogLine(lineId) {
  logFilter.lineId = lineId;
  logPage = 1;
  document.querySelectorAll('.log-pill').forEach(p => p.classList.toggle('active', p.dataset.line === lineId));
  renderLogTable();
}

function renderLogTab() {
  logPage = 1;
  const pillsEl = document.getElementById('logLinePills');
  if (pillsEl) {
    const lineMap = {};
    LINES.forEach(l => { lineMap[l.id] = l.name; });
    const uniqueLines = [...new Set(LOGS.map(e => e.lineId))].sort();
    let html = '<button class="log-pill' + (logFilter.lineId === 'all' ? ' active' : '') + '" data-line="all" onclick="setLogLine(\'all\')">전체</button>';
    uniqueLines.forEach(id => {
      html += '<button class="log-pill' + (logFilter.lineId === id ? ' active' : '') + '" data-line="' + id + '" onclick="setLogLine(\'' + id + '\')">' + id + '</button>';
    });
    pillsEl.innerHTML = html;
  }
  renderLogTable();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function renderLogTable() {
  const wrap = document.getElementById('logTableWrap');
  const countEl = document.getElementById('logCount');
  if (!wrap) return;
  const filtered = getFilteredLogs();
  const shown = filtered.slice(0, logPage * LOG_PAGE_SIZE);
  const remaining = filtered.length - shown.length;
  if (countEl) countEl.textContent = filtered.length.toLocaleString() + ' / ' + LOGS.length.toLocaleString() + '건';
  if (!filtered.length) {
    wrap.innerHTML = '<div class="log-empty">' + (logFilter.search || logFilter.lineId !== 'all' ? '검색 결과가 없습니다.' : '완료 기록이 없습니다.') + '</div>';
    return;
  }
  const lineMap = {};
  LINES.forEach(l => { lineMap[l.id] = l.name; });
  let html = '<table class="log-table"><thead><tr>' +
    '<th>시각</th><th>라인</th><th>테이블</th><th>작업자</th><th style="text-align:right;">사이클</th>' +
    '</tr></thead><tbody>';
  shown.forEach(e => {
    const t = e.time ? new Date(e.time) : null;
    const timeStr = t && !isNaN(t)
      ? String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0')
      : e.time || '—';
    const lineName = lineMap[e.lineId] || e.lineId || '—';
    const cycleStr = e.cycleSecs != null
      ? (e.cycleSecs >= 60
          ? Math.floor(e.cycleSecs / 60) + 'm ' + (e.cycleSecs % 60).toFixed(0) + 's'
          : e.cycleSecs.toFixed(1) + 's')
      : '—';
    html += '<tr>' +
      '<td class="log-time">' + timeStr + '</td>' +
      '<td><span class="log-line-badge">' + (e.lineId || '—') + '</span>' +
      ' <span style="font-size:11px;color:var(--text-3);">' + lineName + '</span></td>' +
      '<td style="font-size:12px;color:var(--text);">' + e.tableName + '</td>' +
      '<td style="font-size:11px;color:var(--text-3);">' + e.workerName + '</td>' +
      '<td style="text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text-4);">' + cycleStr + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  if (remaining > 0) {
    html += '<button class="log-more-btn" onclick="logPage++;renderLogTable();">더 보기 · ' + remaining.toLocaleString() + '건 남음</button>';
  }
  wrap.innerHTML = html;
}

function switchMainTab(tab) {
  activeMainTab = tab;
  document.querySelectorAll('.main-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tabLine').style.display = tab === 'line' ? '' : 'none';
  document.getElementById('tabLog').style.display = tab === 'log' ? '' : 'none';
  if (tab === 'log') renderLogTab();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function overlayDefectData(lineArr) {
  const today = new Date().toISOString().slice(0, 10);
  const events = JSON.parse(localStorage.getItem('qc_events_' + today) || '[]');
  const byLine = {};
  events.forEach(e => {
    const lid = e.line_id || e.line || '';
    if (!lid) return;
    if (!byLine[lid]) byLine[lid] = { defectCount: 0, inspectionQty: 0 };
    byLine[lid].defectCount += Number(e.defect_count) || 0;
    byLine[lid].inspectionQty += Number(e.inspection_qty) || 0;
  });
  lineArr.forEach(l => {
    const d = byLine[l.id];
    if (d && d.inspectionQty > 0) {
      l.defectRate = d.defectCount / d.inspectionQty;
      l.defectCount = d.defectCount;
    }
  });
}

async function loadData() {
  try {
    let raw;
    if (API_CONFIG.useMock) {
      await new Promise(r => setTimeout(r, 150));
      raw = getMockData();
    } else {
      const res = await fetch(API_CONFIG.baseUrl + API_CONFIG.endpoint, { headers: { 'ngrok-skip-browser-warning': 'true' } });
      if (!res.ok) throw new Error('서버 오류 HTTP ' + res.status);
      raw = await res.json();
    }
    LINES = adaptApiResponse(raw);
    overlayDefectData(LINES);
    localStorage.setItem('production_lines', JSON.stringify(LINES.map(l => ({ id: l.id, name: l.name, floor: l.floor, isHelper: l.isHelper }))));
    setConnectionStatus('ok');
    renderLineList();
    renderDetail();
    loadLogs();
  } catch (e) {
    console.error('[API] loadData 실패:', e);
    setConnectionStatus('error', e.message);
    if (!LINES.length) {
      LINES = adaptApiResponse(getMockData());
      overlayDefectData(LINES);
      localStorage.setItem('production_lines', JSON.stringify(LINES.map(l => ({ id: l.id, name: l.name, floor: l.floor, isHelper: l.isHelper }))));
      renderLineList();
      renderDetail();
    }
  }
}

function setConnectionStatus(state) {
  const badge = document.getElementById('statusPill');
  const text = document.getElementById('statusText');
  badge.classList.remove('error');
  if (state === 'ok') {
    const t = new Date();
    text.textContent = 'LIVE · ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  } else {
    badge.classList.add('error');
    text.textContent = 'CONN ERROR';
  }
}

function startApiMode() {
  dataMode = 'api';
  if (pollTimer) clearInterval(pollTimer);
  loadData();
  pollTimer = setInterval(loadData, POLL_INTERVAL);
}

function filtered() { return activeFloor === 'all' ? LINES : LINES.filter(l => l.floor === activeFloor); }
function rateClass(r) { return r >= 0.85 ? 'badge-ok' : r >= 0.6 ? 'badge-warn' : 'badge-bad'; }
function rateColor(r) { return r >= 0.85 ? '#16A34A' : r >= 0.6 ? '#0D9488' : '#0C4A6E'; }
function kpiClass(r) { return r >= 0.85 ? 'ok' : r >= 0.6 ? 'warn' : 'danger'; }

function renderLineList() {
  const el = document.getElementById('lineList');
  const list = filtered();
  el.innerHTML = '';
  list.forEach((l, i) => {
    const r = l.target > 0 ? l.actual / l.target : 0;
    const div = document.createElement('div');
    div.className = 'line-card' + (i === activeIdx ? ' active' : '');
    div.innerHTML =
      '<div class="lc-row">' +
      '<div><span class="lc-id">' + l.id + '</span><span class="lc-name-txt">' + l.name + '</span></div>' +
      (l.isHelper ? '<span class="badge badge-aux">AUX</span>' : '<span class="badge ' + rateClass(r) + '">' + Math.round(r*100) + '%</span>') +
      '</div>' +
      (l.isHelper ? '' : '<div class="lc-bar"><div class="lc-bar-fill" style="width:' + Math.min(r*100,100).toFixed(1) + '%;background:' + rateColor(r) + ';"></div></div>');
    div.onclick = () => { activeIdx = i; renderLineList(); renderDetail(); closeSidebar(); };
    el.appendChild(div);
  });
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function renderDetail() {
  const list = filtered();
  const l = list[activeIdx];
  if (!l) return;
  document.getElementById('lhId').textContent = l.id;
  document.getElementById('lhName').textContent = l.name;
  document.getElementById('lhMeta').textContent = l.floor + ' · ' + (l.isHelper ? 'Auxiliary' : 'Sewing Line');
  const n = new Date();
  document.getElementById('lhUpdated').textContent = 'Updated ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  ['kpiActual','kpiRate','kpiDefect','kpiWorker'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('ok','warn','danger','aux');
    el.style.borderLeftColor = '';
  });
  if (l.isHelper) {
    document.getElementById('kpiActual').classList.add('aux');
    document.getElementById('kpiRate').classList.add('aux');
    document.getElementById('kpiDefect').classList.add('aux');
    document.getElementById('kActual').textContent = '—';
    document.getElementById('kTarget').textContent = '—';
    document.getElementById('kRate').textContent = '—';
    document.getElementById('kRate').style.color = '';
    document.getElementById('kRateSub').textContent = '보조 라인';
    document.getElementById('kDefect').textContent = '—';
    document.getElementById('kDefect').style.color = '';
    document.getElementById('kDefectSub').textContent = '—';
    document.getElementById('kWorker').textContent = l.workers;
    renderChart(l); renderAlerts(l, 0); return;
  }
  const r = l.target > 0 ? l.actual / l.target : 0;
  document.getElementById('kActual').textContent = l.actual.toLocaleString();
  document.getElementById('kTarget').textContent = l.target.toLocaleString();
  const rEl = document.getElementById('kRate');
  rEl.textContent = Math.round(r * 100) + '%';
  rEl.style.color = rateColor(r);
  document.getElementById('kRateSub').textContent = r >= 0.85 ? '목표 달성 중' : r >= 0.6 ? '미달 주의' : '지연 위험';
  document.getElementById('kpiRate').classList.add(kpiClass(r));
  const dEl = document.getElementById('kDefect');
  const defectBad = l.defectRate > 0.05;
  dEl.textContent = (l.defectRate * 100).toFixed(1) + '%';
  dEl.style.color = defectBad ? '#0C4A6E' : '#16A34A';
  document.getElementById('kDefectSub').textContent = l.defectCount + '건 발생';
  if (defectBad) document.getElementById('kpiDefect').classList.add('danger');
  document.getElementById('kWorker').textContent = l.workers;
  renderChart(l); renderAlerts(l, r);
  loadClickStatus(l.isHelper ? null : l.id);
}

function renderChart(l) {
  const canvas = document.getElementById('hourChart');
  if (!canvas) return;
  const parent = canvas.parentElement;
  if (parent.offsetWidth === 0) { requestAnimationFrame(() => renderChart(l)); return; }
  const labels = l.hourly.map(h => h.hour);
  const data = l.hourly.map(h => h.count);
  const workHourSet = new Set(l.workHours || []);
  // 시간당 목표 = 일별 목표 ÷ 근무 시간 수(API가 반환한 시간대 수)
  const workCount = workHourSet.size || 9;
  const hTarget = l.target > 0 ? l.target / workCount : 0;
  const colors = data.map((c, i) => {
    // 생산량이 0인 시간대(비근무 포함)는 회색
    if (!c) return '#E2E8F0';
    if (hTarget === 0) return '#0EA5E9';
    const rr = c / hTarget;
    return rr >= 0.85 ? '#0EA5E9' : rr >= 0.6 ? '#0D9488' : '#0C4A6E';
  });
  // minBarLength: 실적이 0이어도 막대가 보이도록 최소 높이(px) 지정
  const datasets = [{ label: '실적', data, backgroundColor: colors, borderRadius: 2, borderSkipped: false, minBarLength: 3 }];
  // 목표선은 근무 시간대에만 표시
  if (hTarget > 0) datasets.push({ label: '목표', type: 'line', data: labels.map(lab => workHourSet.has(lab) ? hTarget : null), borderColor: '#94A3B8', borderDash: [4,4], borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0, spanGaps: false });
  if (chart) { chart.destroy(); chart = null; }
  chart = new Chart(canvas, {
    type: 'bar', data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 350 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0F172A', borderColor: '#1E293B', borderWidth: 1,
          titleColor: '#F8FAFC', bodyColor: '#94A3B8', padding: 10,
          titleFont: { family: "'Inter', sans-serif", weight: '600', size: 12 },
          bodyFont: { family: "'Inter', sans-serif", size: 11 },
          callbacks: { title: ctx => ctx[0].label + ':00', label: ctx => ctx.datasetIndex === 0 ? ' 실적 ' + ctx.parsed.y + '개' : ' 목표 ' + Math.round(ctx.parsed.y) + '개' },
        },
      },
      scales: {
        x: {
          ticks: {
            font: { size: 11, family: "'JetBrains Mono', monospace" }, color: '#94A3B8',
            // 24개 틱 라벨이 겹치지 않도록 최대 12개만 표시
            maxTicksLimit: 12, autoSkip: true, maxRotation: 0,
          },
          grid: { display: false }, border: { color: '#E2E8F0' },
        },
        y: { ticks: { font: { size: 11, family: "'JetBrains Mono', monospace" }, color: '#94A3B8' }, grid: { color: '#F1F5F9' }, border: { display: false }, min: 0 },
      },
    },
  });
}

function renderAlerts(l, r) {
  const row = document.getElementById('alertRow');
  row.innerHTML = '';
  const add = (cls, icon, text) => {
    const p = document.createElement('div');
    p.className = 'alert-pill ' + cls;
    p.innerHTML = '<span class="ai"><i data-lucide="' + icon + '"></i></span> ' + text;
    row.appendChild(p);
  };
  (l.bottlenecks || []).forEach(b => add('warn', 'alert-triangle', 'BOTTLENECK · ' + b.process + ' +' + Math.round(b.pct) + '%'));
  if (!l.isHelper && l.defectRate > 0.05) add('err', 'x-circle', 'DEFECT THRESHOLD · ' + (l.defectRate*100).toFixed(1) + '%');
  if (!l.isHelper && r < 0.6) add('err', 'arrow-down', 'PRODUCTION DELAY · 관리자 확인 필요');
  if (row.children.length === 0) add('info', 'check-circle-2', l.isHelper ? 'AUX OPERATIONAL · 보조 라인 운영 중' : 'OPERATING NORMALLY · 정상 운영 중');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function updateClock() {
  const n = new Date();
  document.getElementById('clk').textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  const MM = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('dt').textContent = String(n.getDate()).padStart(2,'0') + ' ' + MM[n.getMonth()] + ' ' + n.getFullYear();
}

document.querySelectorAll('.floor-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.floor-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeFloor = t.dataset.floor;
    activeIdx = 0;
    renderLineList();
    renderDetail();
  };
});

window.addEventListener('storage', e => {
  if (e.key && e.key.startsWith('qc_events_')) {
    overlayDefectData(LINES);
    renderLineList();
    renderDetail();
  }
});

function toggleSidebar() {
  const panel = document.querySelector('.left-panel');
  const overlay = document.getElementById('sidebarOverlay');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  overlay.classList.toggle('show', !isOpen);
}
function closeSidebar() {
  document.querySelector('.left-panel').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

updateClock();
setInterval(updateClock, 10000);
if (typeof lucide !== 'undefined') lucide.createIcons();
startApiMode();

</script>
</body>
</html>
